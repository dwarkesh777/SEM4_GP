services:
  - type: web
    name: nestnode-backend
    env: python
    region: singapore   # Closest to India — change to 'ohio' or 'oregon' if needed
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn nestnode_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nestnode_backend.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.13.2"
      # Add these via Render dashboard (keep secrets out of this file):
      # DJANGO_SECRET_KEY
      # MONGODB_URI
      # CLOUDINARY_CLOUD_NAME
      # CLOUDINARY_API_KEY
      # CLOUDINARY_API_SECRET
      # EMAIL_HOST_USER
      # EMAIL_HOST_PASSWORD
