  <!-- Headboard -->
  <rect x="18" y="17" width="28" height="6" rx="3" fill="#2563EB"/>

  <!-- Pillows -->
  <rect x="20" y="22" width="10" height="7" rx="3.5" fill="white" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="34" y="22" width="10" height="7" rx="3.5" fill="white" stroke="#06B6D4" stroke-width="1.5"/>

  <!-- Mattress -->
  <rect x="18" y="27" width="28" height="8" rx="2.5" fill="#2563EB" opacity="0.8"/>

  <!-- Bed base -->
  <rect x="18" y="33" width="28" height="7" rx="2" fill="#1d4ed8" opacity="0.4"/>
</svg>
