<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon: Location pin with a bed inside -->
  <path d="M60 10 C38 10 20 28 20 50 C20 70 45 92 60 108 C75 92 100 70 100 50 C100 28 82 10 60 10 Z"
        fill="url(#iconGrad)" filter="url(#shadow)"/>
  <!-- Inner circle cutout -->
  <circle cx="60" cy="48" r="24" fill="white"/>

  <!-- Bed icon inside pin -->
  <rect x="42" y="50" width="36" height="16" rx="3" fill="#2563EB" opacity="0.15"/>
  <rect x="42" y="44" width="36" height="10" rx="3" fill="#2563EB" opacity="0.85"/>
  <rect x="44" y="40" width="12" height="8" rx="4" fill="white" stroke="#06B6D4" stroke-width="1.2"/>
  <rect x="60" y="40" width="12" height="8" rx="4" fill="white" stroke="#06B6D4" stroke-width="1.2"/>
  <rect x="40" y="36" width="40" height="7" rx="3.5" fill="#2563EB"/>

  <!-- Divider -->
  <line x1="108" y1="30" x2="108" y2="90" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- "bed" in dark navy -->
  <text
    x="118" y="68"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="800"
    fill="#ffffff"
    letter-spacing="-2"
  >bed</text>

  <!-- "buddy" in blue gradient via fill -->
  <text
    x="221" y="68"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="800"
    fill="url(#textGrad)"
    letter-spacing="-2"
  >buddy</text>

  <!-- Tagline -->
  <text
    x="120" y="88"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="12"
    font-weight="500"
    fill="#94a3b8"
    letter-spacing="4"
  >FIND · BOOK · STAY</text>
</svg>
